# Builds Nanolight as an AppImage for Linux x86_64 and aarch64 (64-bit Arm).
#
# An AppImage holds one CPU architecture, so there are two files, one per
# architecture. Zig cross-compiles both on the same runner, as
# pc/package.sh does for the tarballs. Nanolight opens X11, GTK and
# gdk-pixbuf at run time (dlopen), so nothing needs bundling: the AppImage
# is the program, its icon and its .desktop file, and uses the GTK 3 the
# desktop already has.
#
# Run it from the Actions tab (Run workflow) and download the files from the
# run's Artifacts, or push a v* tag to attach them to that tag's release.
name: AppImage

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    env:
      ARCH: ${{ matrix.arch }}
      # The runner has no FUSE: run appimagetool, and the smoke test, unpacked.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;;
            *) version="0.0.0-${GITHUB_SHA::7}" ;;
          esac
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: >
          zig build install
          -Doptimize=ReleaseSafe
          -Dtarget="${ARCH}-linux-gnu"
          -Dversion="$VERSION"
          --prefix "$RUNNER_TEMP/build"

      - name: Assemble the AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp "$RUNNER_TEMP/build/bin/nanolight" AppDir/usr/bin/nanolight
          cp src/icon-256.png AppDir/nanolight.png
          cat > AppDir/nanolight.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Nanolight
          Comment=A launcher: apps, math, Google and Raycast extensions
          Exec=nanolight
          Icon=nanolight
          Terminal=false
          Categories=Utility;
          X-AppImage-Version=$VERSION
          EOF
          ln -s usr/bin/nanolight AppDir/AppRun

      - name: Build the AppImage
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          # appimagetool is an x86_64 program; ARCH picks which runtime it
          # embeds, so it packs the aarch64 AppDir too.
          "$RUNNER_TEMP/appimagetool" --no-appstream AppDir "Nanolight-$VERSION-$ARCH.AppImage"
          sha256sum "Nanolight-$VERSION-$ARCH.AppImage" > "Nanolight-$VERSION-$ARCH.AppImage.sha256"

      - name: Smoke test (x86_64 only, the runner can run it)
        if: matrix.arch == 'x86_64'
        run: |
          out="$(./Nanolight-$VERSION-$ARCH.AppImage --version)"
          echo "$out"
          test "$out" = "nanolight $VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: nanolight-appimage-${{ matrix.arch }}
          path: |
            Nanolight-*.AppImage
            Nanolight-*.AppImage.sha256

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          # Both architectures run at once, and a Release workflow may be
          # making the release too: create it if it isn't there, ignore losing.
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "Nanolight ${tag#v}" --notes "Nanolight ${tag#v}" >/dev/null 2>&1 \
            || true
          gh release upload "$tag" "Nanolight-$VERSION-$ARCH.AppImage" "Nanolight-$VERSION-$ARCH.AppImage.sha256" --clobber
